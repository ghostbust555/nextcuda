<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <linearGradient id="cudaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a3e635" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .font-main { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 70px; letter-spacing: 1.5px; }
      .font-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 15px; fill: #64748b; letter-spacing: 5.5px; }
      .font-tags { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 16.5px; fill: #e2e8f0; letter-spacing: 0.8px; }
      .font-center { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 40px; fill: #ffffff; }
    </style>
  </defs>
  <rect width="800" height="240" rx="28" fill="#090d16" />
  <g transform="translate(138, 120)">
    <circle r="83" fill="none" stroke="#1e293b" stroke-width="3" stroke-dasharray="5 7" />
    <path d="M 0 0 L -75 0 A 75 75 0 0 1 0 -75 Z" fill="#10b981" />
    <path d="M 0 0 L 0 -75 A 75 75 0 0 1 75 0 Z" fill="#84cc16" />
    <path d="M 0 0 L 75 0 A 75 75 0 0 1 0 75 Z" fill="#06b6d4" />
    <path d="M 0 0 L 0 75 A 75 75 0 0 1 -75 0 Z" fill="#f59e0b" />
    <circle cx="0" cy="-75" r="5.5" fill="#facc15" filter="url(#glow)" />
    <circle r="38" fill="#090d16" />
    <circle r="33" fill="none" stroke="#a3e635" stroke-width="3.5" filter="url(#glow)" />
    <text x="0" y="14" text-anchor="middle" class="font-center">N</text>
  </g>
  <text x="262" y="128" class="font-main"><tspan fill="#ffffff">NEXT</tspan><tspan fill="url(#cudaGrad)">CUDA</tspan></text>
  <text x="265" y="166" class="font-sub">THE SWISS-ARMY COMPUTE ENGINE</text>
  <text x="265" y="202" class="font-tags"><tspan fill="#84cc16">V</tspan>IDEO • <tspan fill="#06b6d4">C</tspan>HAT • <tspan fill="#f59e0b">I</tspan>MAGE • <tspan fill="#10b981">A</tspan>UDIO</text>
</svg>
