# Qwen3.8-27B GSQ-RCO IQ3_S (+ its MTP head) over the two 12 GB cards, whole
# model card (model-cards/README.md): what `nextcuda models search | pull` offers and what the registry entry gets.
# The engine (llm/qwen35) keeps every weight resident: its 64 layers split over the cards (the 5070 last: it takes the
# most layers and the head), the rows handed over at the boundary. ISTA-DASLab's file mixes IQ1_M ... Q6_K by tensor
# (its card's "task-lossless" point); the same file brainiac-llm's llama.cpp serves.
id: qwen3.8-27b-gsq-iq3s
kind: llm
arch: qwen35
title: Qwen3.8-27B GSQ-RCO IQ3_S (two cards, whole)
about: 'Qwen''s dense Qwen3.8 27B: 64 layers (48 gated DeltaNet, 16 gated full attention), a dense SwiGLU; ISTA-DASLab''s GSQ-RCO IQ3_S GGUF with the MTP head inside (11.3 GiB). Split over the RTX 5070 and RTX 3060, nothing streamed. Text (vision: the mmproj beside it, not yet)'
gpus: '1,0'                      # the order the engine takes them: the last (the 5070) is filled first
split: true
vram_gib: 10.7                   # its memory on each card at 96K (weights, the cache, a prompt chunk's work; measured)
ctx: '98304'                     # 96K: prompt chunks of 1,024 (128K does not fit beside the weights)
tools: true
tasks: true
env:
  NS_PARALLEL: '1'               # one session: all of the cache to it
